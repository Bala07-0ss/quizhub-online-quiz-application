{% extends 'base.html' %}
{% block title %}{{ heading }} | QuizHub{% endblock %}
{% block content %}
<div class="form-card card shadow-sm mx-auto">
    <div class="card-body p-4"><a href="{% url 'question_list' quiz.id %}">← Back to questions</a>
        <h1 class="h3 my-3">{{ heading }}</h1>
        <p class="text-muted">{{ quiz.title }}</p>
        <form method="post" novalidate>
            {% csrf_token %}
            {% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>
                {{ field }}
                {%for error in field.errors %}
                <div class="text-danger small">{{ error }}</div>
                {% endfor %}</div>
                {% endfor %}
            <button class="btn btn-primary">Save question</button>
            <a class="btn btn-light" href="{% url 'question_list' quiz.id %}">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
